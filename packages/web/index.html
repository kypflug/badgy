<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      // Canonicalize to the apex host before anything else loads (SW, /api, assets).
      if (location.hostname === 'www.badgy.tech')
        location.replace(
          `https://badgy.tech${location.pathname}${location.search}${location.hash}`,
        );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Badgy</title>
    <meta name="description" content="Plan office attendance against your workplace policy." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="theme-color" content="#e9edf2" />
    <script>
      // Apply the persisted/system theme before CSS loads so dark-mode launches do not flash paper.
      try {
        const mode = localStorage.getItem('badgy:theme') || 'system';
        const dark =
          mode === 'dark' ||
          (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101419' : '#e9edf2';
      } catch {
        // Storage can be unavailable in hardened browsing modes; the light HTML default is safe.
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Badgy" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <badgy-app></badgy-app>
    <div class="boot-splash" aria-hidden="true"><span class="brand-mark"></span></div>
    <script type="module" src="./main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
