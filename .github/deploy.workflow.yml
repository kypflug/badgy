# CI deploy workflow — kept here (not under .github/workflows/) because the push token
# lacked the `workflow` GitHub scope. To ACTIVATE: move this file to
# `.github/workflows/deploy.yml` and push with a token that has the `workflow` scope
# (e.g. `gh auth refresh -s workflow`), then set the repo secrets/vars per docs/SETUP.md.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run gates
      - run: bash scripts/package-app.sh
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: dist-deploy.zip
